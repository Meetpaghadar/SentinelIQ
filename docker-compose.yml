services:
  postgres:
    image: postgres:18
    container_name: sentineliq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentineliq
      POSTGRES_USER: sentineliq
      POSTGRES_PASSWORD: sentineliq_dev
    ports:
      - "5433:5432"
    volumes:
      - sentineliq_postgres_data:/var/lib/postgresql

volumes:
  sentineliq_postgres_data: