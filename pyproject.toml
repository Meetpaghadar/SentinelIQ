[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentineliq"
version = "0.1.0"
description = "SentinelIQ — enterprise knowledge intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SentinelIQ" }]
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7",
    "openai>=1.0,<3.0",
    "pgvector>=0.3,<1.0",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0,<3.0",
    "tomli>=2.0.1",
    "uvicorn>=0.30",
    "pymupdf>=1.24,<2.0",
    "PyJWT>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pyright>=1.1",
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
sentineliq = "sentineliq.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
